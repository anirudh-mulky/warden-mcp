# Everything Warden needs, on your own machine. No cloud account, no cost.
#
# Development (you run the gateway with `pnpm dev`):
#   pnpm infra:up     start only the two databases
#   pnpm infra:down   stop them (data survives, it lives in the volumes)
#
# The whole app, one command (needs JWT_SECRET in a root .env — see README):
#   pnpm app          build and start databases + gateway + dashboard
#   pnpm app:down     stop it all
#   then open http://localhost:8080

services:
  mongo:
    image: mongo:8
    container_name: warden-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # DynamoDB Local: the real DynamoDB engine, running on your machine, free.
  dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: warden-dynamodb
    ports:
      - "8000:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/data"]
    working_dir: /home/dynamodblocal
    volumes:
      - dynamo-data:/data
    user: root

  # One-off: create the DynamoDB tables (idempotent), then exit.
  setup:
    profiles: ["app"]
    build: .
    command: ["node", "dist/scripts/create-tables.js"]
    environment: &app-env
      MONGODB_URI: mongodb://mongo:27017/warden
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env at the repo root (see README)}
      SIGNUP_CODE: ${SIGNUP_CODE:-}
    depends_on:
      dynamodb:
        condition: service_started

  # The gateway: /mcp for agents, /api and the dashboard for humans.
  gateway:
    profiles: ["app"]
    build: .
    container_name: warden-gateway
    ports:
      - "8080:8080"
    environment: *app-env
    depends_on:
      mongo:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  mongo-data:
  dynamo-data:
